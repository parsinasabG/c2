version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: cmms_postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME:-cmms_db}
      - POSTGRES_USER=${DB_USER:-cmms_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-cmms_password}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmms_backend_api
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-placeholder_secret_key_for_development_!change_me!}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
      - DB_NAME=${DB_NAME:-cmms_db}
      - DB_USER=${DB_USER:-cmms_user}
      - DB_PASSWORD=${DB_PASSWORD:-cmms_password}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend # Context should be ./frontend where the Dockerfile is
      dockerfile: Dockerfile # Dockerfile is directly in ./frontend
    container_name: cmms_frontend_ui
    ports:
      - "3000:80" # Nginx in frontend container serves on port 80
    volumes:
      - ./frontend/app:/app/app # Mount the 'app' subdirectory containing React code
      # Note: The Dockerfile for frontend copies from /app/build.
      # For live reload, the Dockerfile CMD would need to be `npm start` from within /app/app
      # and volumes adjusted. Current setup is for serving a built app.
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true # For dev server if used
      - WDS_SOCKET_PORT=3000 # For dev server if used
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
